<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Hub</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Tela de PIN -->
  <section id="lock" class="screen">
    <form id="pin-form" class="lock-card" autocomplete="off">
      <div class="lock-icon">🔒</div>
      <h1 id="lock-title">Hub</h1>
      <p id="lock-sub" class="muted">Digite seu PIN</p>
      <input id="pin" type="password" inputmode="numeric" placeholder="PIN" autofocus>
      <input id="pin2" type="password" inputmode="numeric" placeholder="Confirme o PIN" hidden>
      <button type="submit" id="pin-btn" class="btn primary">Entrar</button>
      <p id="pin-error" class="error" role="alert"></p>
    </form>
  </section>

  <!-- Hub -->
  <section id="hub" class="screen" hidden>
    <header class="topbar">
      <h1 id="hub-title">Meus Projetos</h1>
      <div class="actions">
        <button id="btn-add" class="btn primary">+ Adicionar</button>
        <button id="btn-edit" class="btn" title="Modo edição">✏️ Editar</button>
        <button id="btn-settings" class="btn icon" title="Configurações">⚙️</button>
        <button id="btn-lock" class="btn icon" title="Bloquear">🔒</button>
      </div>
    </header>
    <div id="banner" class="banner" hidden></div>
    <input id="search" type="search" placeholder="Buscar projeto…">
    <main id="grid" class="grid"></main>
    <p id="empty" class="empty muted" hidden>Nenhum projeto ainda. Clique em <b>+ Adicionar</b>.</p>
  </section>

  <!-- Modal: link -->
  <dialog id="link-dialog">
    <form id="link-form" method="dialog">
      <h2 id="link-dialog-title">Adicionar projeto</h2>
      <label>Nome
        <input name="name" required maxlength="60" placeholder="Meu app">
      </label>
      <label>Link
        <input name="url" required placeholder="https://meu-app.up.railway.app">
      </label>
      <label>Descrição <span class="muted">(opcional)</span>
        <input name="desc" maxlength="120" placeholder="O que esse app faz">
      </label>
      <div class="icon-row">
        <div id="icon-preview" class="icon-box"></div>
        <div class="icon-fields">
          <label>Ícone <span class="muted">(URL de imagem, emoji ou envie um arquivo)</span>
            <input name="icon" placeholder="https://…/logo.png ou 🚀">
          </label>
          <div class="icon-buttons">
            <label class="btn small file-btn">Enviar imagem<input id="icon-file" type="file" accept="image/*" hidden></label>
            <button type="button" id="icon-clear" class="btn small">Usar automático</button>
          </div>
        </div>
      </div>
      <div class="dialog-actions">
        <button type="button" id="link-delete" class="btn danger">Remover</button>
        <span class="spacer"></span>
        <button type="button" class="btn" data-close>Cancelar</button>
        <button type="submit" class="btn primary">Salvar</button>
      </div>
    </form>
  </dialog>

  <!-- Modal: configurações -->
  <dialog id="settings-dialog">
    <form id="settings-form" method="dialog">
      <h2>Configurações</h2>
      <label>Título do hub
        <input name="title" maxlength="40">
      </label>

      <h3>Sincronização com o GitHub</h3>
      <p class="muted small">Necessário para salvar alterações no repositório. O token fica salvo só neste navegador.</p>
      <label>Token do GitHub (fine-grained, permissão <i>Contents: Read and write</i> só neste repositório)
        <input name="token" type="password" placeholder="github_pat_…" autocomplete="off">
      </label>
      <div class="row3">
        <label>Usuário/organização <input name="owner" placeholder="seu-usuario"></label>
        <label>Repositório <input name="repo" placeholder="hub"></label>
        <label>Branch <input name="branch" placeholder="main"></label>
      </div>
      <p id="sync-status" class="muted small"></p>

      <h3>Trocar PIN</h3>
      <div class="row2">
        <label>Novo PIN <input name="newpin" type="password" inputmode="numeric" autocomplete="new-password"></label>
        <label>Confirmar <input name="newpin2" type="password" inputmode="numeric" autocomplete="new-password"></label>
      </div>

      <div class="dialog-actions">
        <span class="spacer"></span>
        <button type="button" class="btn" data-close>Cancelar</button>
        <button type="submit" class="btn primary">Salvar</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
